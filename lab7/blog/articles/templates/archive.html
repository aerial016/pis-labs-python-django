{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Архив статей</title>
  <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive">
  <div class="header">
    <img src="{% static 'img/logo.svg' %}" alt="Django public blog">
    {% if user.is_authenticated %}
    <a class="new-post" href="{% url 'create_post' %}">Написать статью</a>
    {% endif %}
  </div>
  <div class="student-filters">
    <form id="group-filter">
      <label for="student-group">Группа</label>
      <input id="student-group" type="text" required>
      <button type="submit">Фильтровать по группе</button>
    </form>
    <form id="average-filter">
      <label for="student-average">Средний балл</label>
      <input id="student-average" type="text" inputmode="decimal" required>
      <button type="submit">Фильтровать по среднему баллу</button>
    </form>
    <p>Таблицы студентов выводятся в консоль браузера (F12 → Console).</p>
  </div>
  <div class="archive">
    {% for post in posts %}
    <div class="one-post">
      <h2 class="post-title"><a href="{% url 'get_article' article_id=post.id %}">{{ post.title }}</a></h2>
      <button type="button" class="fold-button" aria-expanded="true">свернуть</button>
      <div class="article-info">
        <div class="article-author">{{ post.author.username }}</div>
        <div class="article-created-date">{{ post.created_date }}</div>
      </div>
      <p class="article-text">{{ post.get_excerpt }}</p>
    </div>
    {% endfor %}
  </div>
  <script src="{% static 'js/fold-post.js' %}"></script>
  <script src="{% static 'js/helloworld.js' %}"></script>
</body>
</html>
